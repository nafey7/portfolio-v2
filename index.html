<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moiz Nafey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Global time-on-page score: 0 at load, then +1 every 4 seconds, capped at 10.
      // Lives on `window` so any script/component on the site can read it.
      window.relevic_scoring = 0;

      (function () {
        var MAX_SCORE = 10;
        var STEP_MS = 4000;

        var timer = setInterval(function () {
          window.relevic_scoring += 1;

          // Lets other code react instead of polling the variable.
          window.dispatchEvent(
            new CustomEvent('relevic_scoring_change', {
              detail: window.relevic_scoring,
            })
          );

          // Stop counting once we hit the cap.
          if (window.relevic_scoring >= MAX_SCORE) {
            clearInterval(timer);
          }
        }, STEP_MS);
      })();
    </script>
    <link rel="preconnect" href="https://personalize-staging.relevic.com" />
    <script data-relevic-id="anti-flicker" data-relevic-anti-flicker-background="rgba(255, 255, 255, 1)" src="https://personalize-staging.relevic.com/workspaces/anti-flicker/6a4f8ac4743c8bc72ef00af4.js" type="text/javascript"></script>
    <script data-relevic-script="6a4f8ac4743c8bc72ef00af4" src="https://personalize-staging.relevic.com/workspaces/6a4f8ac4743c8bc72ef00af4.js" type="text/javascript" async></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

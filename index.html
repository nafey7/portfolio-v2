<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moiz Nafey</title>
    <script>
      (function () {
        // Wall-clock timestamp for a high-res time relative to page start.
        const clock = (relativeMs) => {
          const d = new Date(performance.timeOrigin + relativeMs);
          const pad = (n, w = 2) => String(n).padStart(w, "0");
          return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
        };

        const isAntiFlicker = (url) => url.includes("anti-flicker");
        const labelFor = (url) =>
          isAntiFlicker(url) ? "Relevic Anti-Flicker Script" : "Relevic Workspace Script";
        const colorFor = (url) => (isAntiFlicker(url) ? "#FF9800" : "#4CAF50");

        // responseEnd of each script, so the onload handler can report parse+execute cost.
        const responseEnds = {};

        const observer = new PerformanceObserver((list) => {
          list.getEntries().forEach((entry) => {
            if (!entry.name.includes("relevic.com/workspaces/")) return;

            const label = labelFor(entry.name);
            responseEnds[isAntiFlicker(entry.name) ? "antiFlicker" : "workspace"] = entry.responseEnd;

            // Cross-origin resources only expose detailed phases with Timing-Allow-Origin.
            const hasDetailedTiming = entry.responseStart > 0;
            // Size fields are also zeroed without Timing-Allow-Origin, so they only mean
            // something when detailed timing is available. transferSize 0 + a real body = cache hit.
            const fromCache = entry.transferSize === 0 && entry.decodedBodySize > 0;

            console.group(
              `%c[Performance] ${label} Load Metrics`,
              `color: ${colorFor(entry.name)}; font-weight: bold;`
            );
            console.log(
              `Fetch Started:     ${entry.startTime.toFixed(2)}ms after page start  (${clock(entry.startTime)})`
            );
            console.log(
              `Fetch Arrived:     ${entry.responseEnd.toFixed(2)}ms after page start  (${clock(entry.responseEnd)})`
            );
            console.log(`Total Duration:    ${entry.duration.toFixed(2)}ms`);
            if (hasDetailedTiming) {
              console.log(
                `Served From:       ${fromCache ? "cache" : "network"} (transfer ${entry.transferSize} bytes, decoded ${entry.decodedBodySize} bytes)`
              );
              console.log(`DNS Lookup:        ${(entry.domainLookupEnd - entry.domainLookupStart).toFixed(2)}ms`);
              console.log(`TCP Handshake:     ${(entry.connectEnd - entry.connectStart).toFixed(2)}ms`);
              console.log(`TTFB:              ${(entry.responseStart - entry.requestStart).toFixed(2)}ms`);
              console.log(`Network Transfer:  ${(entry.responseEnd - entry.responseStart).toFixed(2)}ms`);
            } else {
              console.log(
                "%cDNS / TCP / TTFB / size breakdown unavailable — cross-origin response is missing the `Timing-Allow-Origin` header.",
                "color: #999;"
              );
            }
            console.groupEnd();
          });
        });
        observer.observe({ type: "resource", buffered: true });

        // Fires after the script has been parsed AND executed — the real "ready" moment.
        window.__relevicExecuted = function (key) {
          const now = performance.now();
          const label = key === "antiFlicker" ? "Relevic Anti-Flicker Script" : "Relevic Workspace Script";
          const color = key === "antiFlicker" ? "#FF9800" : "#4CAF50";
          // The observer callback may not have fired yet; read the buffer directly as a fallback.
          let responseEnd = responseEnds[key];
          if (responseEnd === undefined) {
            const match = performance
              .getEntriesByType("resource")
              .filter((e) => e.name.includes("relevic.com/workspaces/"))
              .filter((e) => (key === "antiFlicker" ? isAntiFlicker(e.name) : !isAntiFlicker(e.name)))
              .pop();
            if (match) responseEnd = match.responseEnd;
          }

          console.group(`%c[Performance] ${label} Executed`, `color: ${color}; font-weight: bold;`);
          console.log(`Ready To Use:      ${now.toFixed(2)}ms after page start  (${clock(now)})`);
          if (responseEnd !== undefined) {
            console.log(`Parse + Execute:   ${(now - responseEnd).toFixed(2)}ms (since last byte arrived)`);
          }
          console.groupEnd();
        };
      })();
    </script>
    <link rel="preconnect" href="https://personalize-staging.relevic.com" />
    <script
      data-relevic-id="anti-flicker"
      data-relevic-anti-flicker-background="rgba(255, 255, 255, 1)"
      src="https://personalize-staging.relevic.com/workspaces/anti-flicker/6a4f8ac4743c8bc72ef00af4.js"
      type="text/javascript"
      onload="window.__relevicExecuted && window.__relevicExecuted('antiFlicker')"
    ></script>
    <script
      data-relevic-script="6a4f8ac4743c8bc72ef00af4"
      src="https://personalize-staging.relevic.com/workspaces/6a4f8ac4743c8bc72ef00af4.js"
      type="text/javascript"
      async
      onload="window.__relevicExecuted && window.__relevicExecuted('workspace')"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
